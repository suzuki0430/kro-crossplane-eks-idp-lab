AWSTemplateFormatVersion: '2010-09-09'
Description: Scoped provider identities and an image repository for the disposable IDP lab.
Parameters:
  LabId:
    Type: String
    AllowedPattern: '[a-z0-9]{6,12}'
Resources:
  WorkloadBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'idplab-${LabId}-workload-boundary'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [s3:GetObject, s3:PutObject]
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::idplab-${AWS::AccountId}-${LabId}-*/uploads/*'
              - !Sub 'arn:${AWS::Partition}:s3:::idplab-${AWS::AccountId}-${LabId}-*/_health/*'
          - Effect: Allow
            Action: s3:DeleteObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::idplab-${AWS::AccountId}-${LabId}-*/_health/*'
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub 'arn:${AWS::Partition}:s3:::idplab-${AWS::AccountId}-${LabId}-*'
  S3ProviderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'idplab-${LabId}-provider-s3'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: pods.eks.amazonaws.com}
            Action: [sts:AssumeRole, sts:TagSession]
            Condition:
              StringEquals:
                aws:RequestTag/eks-cluster-arn: !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/idplab-${LabId}'
                aws:RequestTag/kubernetes-namespace: crossplane-system
                aws:RequestTag/kubernetes-service-account: provider-aws-s3
      Policies:
        - PolicyName: lab-buckets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                # Bucket refresh permissions do not grant access to object contents.
                Action: [s3:CreateBucket, 's3:GetBucket*', s3:GetAccelerateConfiguration, s3:GetLifecycleConfiguration, s3:GetReplicationConfiguration, s3:GetEncryptionConfiguration, s3:ListBucket, s3:PutBucketTagging, s3:PutEncryptionConfiguration, s3:PutBucketPublicAccessBlock]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::idplab-${AWS::AccountId}-${LabId}-*'
      Tags: [{Key: ManagedBy, Value: kro-crossplane-idp-lab}, {Key: LabId, Value: !Ref LabId}]
  IAMProviderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'idplab-${LabId}-provider-iam'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: pods.eks.amazonaws.com}
            Action: [sts:AssumeRole, sts:TagSession]
            Condition:
              StringEquals:
                aws:RequestTag/eks-cluster-arn: !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/idplab-${LabId}'
                aws:RequestTag/kubernetes-namespace: crossplane-system
                aws:RequestTag/kubernetes-service-account: provider-aws-iam
      Policies:
        - PolicyName: bounded-workload-roles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # GetRole accepts only a name. Before creation there is no path to
              # resolve, so observing a missing role needs this root-path ARN.
              # This grants read-only metadata access to this lab's role names.
              - Effect: Allow
                Action: iam:GetRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/idplab-${LabId}-*'
              - Effect: Allow
                Action: [iam:CreateRole, iam:PutRolePermissionsBoundary]
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/idplab/${LabId}/workloads/*'
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref WorkloadBoundary
              - Effect: Allow
                Action: [iam:GetRole, iam:DeleteRole, iam:UpdateRole, iam:UpdateRoleDescription, iam:UpdateAssumeRolePolicy, iam:TagRole, iam:UntagRole, iam:ListRoleTags, iam:ListRolePolicies, iam:ListAttachedRolePolicies, iam:ListInstanceProfilesForRole, iam:GetRolePolicy, iam:PutRolePolicy, iam:DeleteRolePolicy]
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/idplab/${LabId}/workloads/*'
      Tags: [{Key: ManagedBy, Value: kro-crossplane-idp-lab}, {Key: LabId, Value: !Ref LabId}]
  EKSProviderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'idplab-${LabId}-provider-eks'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: pods.eks.amazonaws.com}
            Action: [sts:AssumeRole, sts:TagSession]
            Condition:
              StringEquals:
                aws:RequestTag/eks-cluster-arn: !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/idplab-${LabId}'
                aws:RequestTag/kubernetes-namespace: crossplane-system
                aws:RequestTag/kubernetes-service-account: provider-aws-eks
      Policies:
        - PolicyName: lab-pod-identities
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [eks:DescribeCluster, eks:CreatePodIdentityAssociation, eks:ListPodIdentityAssociations]
                Resource: !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/idplab-${LabId}'
              - Effect: Allow
                Action: [eks:DescribePodIdentityAssociation, eks:UpdatePodIdentityAssociation, eks:DeletePodIdentityAssociation, eks:TagResource, eks:UntagResource, eks:ListTagsForResource]
                Resource: !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:podidentityassociation/idplab-${LabId}/*'
              # EKS validates the target role before creating an association.
              - Effect: Allow
                Action: iam:GetRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/idplab/${LabId}/workloads/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/idplab/${LabId}/workloads/*'
                Condition:
                  StringEquals: {iam:PassedToService: pods.eks.amazonaws.com}
      Tags: [{Key: ManagedBy, Value: kro-crossplane-idp-lab}, {Key: LabId, Value: !Ref LabId}]
  S3ProviderIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    Properties:
      ClusterName: !Sub 'idplab-${LabId}'
      Namespace: crossplane-system
      ServiceAccount: provider-aws-s3
      RoleArn: !GetAtt S3ProviderRole.Arn
  IAMProviderIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    Properties:
      ClusterName: !Sub 'idplab-${LabId}'
      Namespace: crossplane-system
      ServiceAccount: provider-aws-iam
      RoleArn: !GetAtt IAMProviderRole.Arn
  EKSProviderIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    Properties:
      ClusterName: !Sub 'idplab-${LabId}'
      Namespace: crossplane-system
      ServiceAccount: provider-aws-eks
      RoleArn: !GetAtt EKSProviderRole.Arn
  AppImages:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub 'idplab-${LabId}/storage-api'
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration: {ScanOnPush: true}
      Tags: [{Key: ManagedBy, Value: kro-crossplane-idp-lab}, {Key: LabId, Value: !Ref LabId}]
Outputs:
  BoundaryArn: {Value: !Ref WorkloadBoundary}
  RepositoryUri: {Value: !GetAtt AppImages.RepositoryUri}
