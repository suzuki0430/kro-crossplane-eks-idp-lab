apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kro-storage-app
  labels:
    rbac.kro.run/aggregate-to-controller: 'true'
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [s3.aws.m.upbound.io]
    resources: [buckets, bucketpublicaccessblocks, bucketserversideencryptionconfigurations]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [iam.aws.m.upbound.io]
    resources: [roles, rolepolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [eks.aws.m.upbound.io]
    resources: [podidentityassociations]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [platform.example.com]
    resources: [storageapps, storageapps/status, storageapps/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
