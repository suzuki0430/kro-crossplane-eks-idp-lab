# Same developer input as the KRO example, on a cluster without KRO.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: storageapps.platform.example.com
spec:
  scope: Namespaced
  group: platform.example.com
  names:
    kind: StorageApp
    plural: storageapps
  defaultCompositionRef:
    name: storage-app
  enforcedCompositionRef:
    name: storage-app
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [storageId, image]
              properties:
                storageId:
                  type: string
                  maxLength: 16
                  pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: storageId is immutable; recreate to reconnect.
                image:
                  type: string
                replicas:
                  type: integer
                  default: 1
                  minimum: 1
                  maximum: 3
            status:
              type: object
              properties:
                bucketName: {type: string}
                endpoint: {type: string}
                availableReplicas: {type: integer}
                storageMessage: {type: string}
                identityMessage: {type: string}
                associationMessage: {type: string}
