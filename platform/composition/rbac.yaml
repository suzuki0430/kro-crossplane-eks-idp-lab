# Crossplane v2 composes these native resources directly; no provider-kubernetes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crossplane-storage-app
  namespace: idp-lab
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, watch]
  - apiGroups: [s3.aws.m.upbound.io]
    resources: [buckets, bucketpublicaccessblocks, bucketserversideencryptionconfigurations]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [iam.aws.m.upbound.io]
    resources: [roles, rolepolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [eks.aws.m.upbound.io]
    resources: [podidentityassociations]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crossplane-storage-app
  namespace: idp-lab
subjects:
  - kind: ServiceAccount
    name: crossplane
    namespace: crossplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crossplane-storage-app
---
# Realtime composition watches use the cluster-wide cache. Mutation stays scoped
# to idp-lab in the Role above; this binding grants only observation elsewhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-storage-app-observer
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [services, serviceaccounts, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [s3.aws.m.upbound.io]
    resources: [buckets, bucketpublicaccessblocks, bucketserversideencryptionconfigurations]
    verbs: [get, list, watch]
  - apiGroups: [iam.aws.m.upbound.io]
    resources: [roles, rolepolicies]
    verbs: [get, list, watch]
  - apiGroups: [eks.aws.m.upbound.io]
    resources: [podidentityassociations]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-storage-app-observer
subjects:
  - kind: ServiceAccount
    name: crossplane
    namespace: crossplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-storage-app-observer
