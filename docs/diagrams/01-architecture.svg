<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1100" viewBox="0 0 1280 1100" role="img" aria-labelledby="title desc">
  <title id="title">StorageAppからアプリとAWSリソースを用意する</title>
  <desc id="desc">管理者がeksctlとCloudFormationでEKSと認証基盤を準備する。開発者のStorageAppをKROがKubernetesリソースと6種類のManaged Resourceへ展開する。CrossplaneのAWS ProviderがAWS APIを操作し、アプリはPod Identityの短期認証情報でS3へアクセスする。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#526279"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#087f70"/></marker>
    <style>
      text { font-family: 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif; fill: #182d47; }
      .title { font-size: 34px; font-weight: 700; } .label { font-size: 26px; font-weight: 600; }
      .body { font-size: 22px; } .small { font-size: 20px; fill: #526279; }
      .line { fill: none; stroke: #526279; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="1100" fill="#f8fafc"/>
  <text x="48" y="60" class="title">1つのStorageAppから、アプリとAWSへ</text>
  <text x="48" y="100" class="body">KROはAPI・依存・Ready、CrossplaneのProviderはAWS操作を担当</text>

  <rect x="48" y="132" width="1184" height="100" rx="16" fill="#fff4df" stroke="#d4af67"/>
  <text x="72" y="171" class="label">管理者が事前に準備  ｜  eksctl / CloudFormation</text>
  <text x="72" y="207" class="body">EKS・VPC・ノード・Pod Identity Agent・Provider用IAM・権限境界</text>

  <rect x="48" y="250" width="1184" height="550" rx="20" fill="#edf3fb" stroke="#b7cbe3" stroke-width="2"/>
  <text x="72" y="300" class="label">EKS上</text>
  <rect x="358" y="266" width="564" height="82" rx="14" fill="#182d47"/>
  <text x="640" y="301" text-anchor="middle" class="label" style="fill:white">開発者 → StorageApp</text>
  <text x="640" y="330" text-anchor="middle" class="small" style="fill:#e0ecfa">storageId / image / replicas</text>

  <path d="M640 348 V434" class="line"/>
  <rect x="420" y="438" width="440" height="78" rx="14" fill="white" stroke="#6994c6" stroke-width="2"/>
  <text x="640" y="470" text-anchor="middle" class="label">KRO</text>
  <text x="640" y="500" text-anchor="middle" class="small">ResourceGraphDefinition（RGD）</text>

  <path d="M550 516 V543 H320 V565" class="line"/>
  <path d="M730 516 V543 H960 V565" class="line"/>
  <rect x="80" y="570" width="480" height="86" rx="14" fill="white" stroke="#6994c6" stroke-width="2"/>
  <text x="320" y="604" text-anchor="middle" class="label">Kubernetesリソース</text>
  <text x="320" y="637" text-anchor="middle" class="small">Deployment / Service / ServiceAccount</text>
  <rect x="720" y="570" width="480" height="86" rx="14" fill="white" stroke="#6994c6" stroke-width="2"/>
  <text x="960" y="604" text-anchor="middle" class="label">Managed Resources（6種類）</text>
  <text x="960" y="637" text-anchor="middle" class="small">S3設定 × 3 / Role / Policy / Association</text>

  <path d="M320 656 V690" class="line"/>
  <path d="M960 656 V690" class="line"/>
  <rect x="80" y="695" width="480" height="72" rx="14" fill="#e1f4ee" stroke="#61a899" stroke-width="2"/>
  <text x="320" y="725" text-anchor="middle" class="label">アプリPod</text>
  <text x="320" y="753" text-anchor="middle" class="small">Go HTTP API / Pod Identity認証</text>
  <rect x="720" y="695" width="480" height="72" rx="14" fill="#e6ecfa" stroke="#6994c6" stroke-width="2"/>
  <text x="960" y="725" text-anchor="middle" class="label">Crossplane + AWS Provider</text>
  <text x="960" y="753" text-anchor="middle" class="small">S3 / IAM / EKS用のProvider</text>

  <path d="M320 767 V902" fill="none" stroke="#087f70" stroke-width="4" marker-end="url(#green-arrow)"/>
  <rect x="150" y="820" width="340" height="38" rx="8" fill="#f8fafc"/>
  <text x="320" y="847" text-anchor="middle" class="body" style="fill:#087f70">短期認証情報でS3読み書き</text>
  <path d="M960 767 V902" class="line"/>
  <rect x="856" y="820" width="208" height="38" rx="8" fill="#f8fafc"/>
  <text x="960" y="847" text-anchor="middle" class="body">AWS APIで管理</text>

  <rect x="80" y="907" width="1120" height="112" rx="16" fill="white" stroke="#c2cedc" stroke-width="2"/>
  <text x="320" y="949" text-anchor="middle" class="label">S3</text>
  <text x="320" y="986" text-anchor="middle" class="body">バケット・公開ブロック・暗号化</text>
  <path d="M640 925 V1001" stroke="#d8e1eb" stroke-width="2"/>
  <text x="960" y="949" text-anchor="middle" class="label">AWS側の管理対象</text>
  <text x="960" y="986" text-anchor="middle" class="body">S3 / IAM / Pod Identity Association</text>
  <text x="48" y="1066" class="small">責務の概略図。Crossplane Compositionは未使用。Provider自身もPod Identityで認証する。</text>
</svg>
